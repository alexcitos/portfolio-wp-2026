# Entorno de desarrollo local: WordPress + MySQL + phpMyAdmin
# Docker Engine nativo en WSL2 (no Docker Desktop).
# Uso: `docker compose up -d` y abrir http://localhost:8080

services:
  db:
    image: mysql:8.4
    container_name: portafolio_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:6.6-php8.3-apache
    container_name: portafolio_wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      # Modo desarrollo: errores visibles y edición de archivos deshabilitada
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', true );
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'PORTAFOLIO_USE_MAILPIT', true );
        define( 'PORTAFOLIO_ENTORNO_LOCAL', true );
    volumes:
      # Núcleo de WordPress persistente (plugins como ACF, uploads, etc.)
      - wp_core:/var/www/html
      # El tema del repo montado en vivo dentro de wp-content/themes/
      - ./portafolio:/var/www/html/wp-content/themes/portafolio

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: portafolio_pma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M

  # Servidor SMTP de pruebas: atrapa todo el correo saliente de WordPress
  # (ver hook phpmailer_init en functions.php) sin entregarlo de verdad, así
  # se puede revisar el envío del formulario de contacto en local. Interfaz
  # web en http://localhost:8025; el puerto SMTP (1025) también se publica
  # al host por si hace falta apuntarle algo desde fuera de Docker.
  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: portafolio_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
  wp_core:
